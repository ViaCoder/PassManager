name: Advisories

# 每天检查一次依赖的安全公告（RustSec 漏洞库）：新公告在下一次发布之前就会被发现，而不是发布之后。
# 失败时 GitHub 会通知仓库所有者；也可以在 Actions 页面手动运行（workflow_dispatch）。
# 发现公告后自动算出修复版本、测试并开 PR。到此为止：不合并、不发布，由维护者确认
# （密码管理器的新依赖版本本身也是风险，见 scripts/advisory_fix.py）。
on:
  schedule:
    - cron: "17 1 * * *" # 每天 01:17 UTC（台北时间 09:17）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # 这一步会运行新版本依赖的代码（构建脚本与测试），所以只有读权限，也不保留检出用的凭据。
  fix:
    needs: advisories
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Update Cargo.lock
        id: lock
        run: |
          mkdir -p "$RUNNER_TEMP/fix"
          python3 -I scripts/advisory_fix.py --summary "$RUNNER_TEMP/fix/summary.md" || echo "::warning::some advisories are still open, see the summary"
          cat "$RUNNER_TEMP/fix/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cp Cargo.lock "$RUNNER_TEMP/fix/Cargo.lock"
          if git diff --quiet Cargo.lock; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      # 在测试之前上传：测试运行的代码改不了要提交的文件。
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lock.outputs.changed == 'true'
        with:
          name: advisory-fix
          path: ${{ runner.temp }}/fix/
      - name: Test
        if: steps.lock.outputs.changed == 'true'
        run: cargo test --workspace --locked --features pm-crypto/test-hooks

  # 这一步有写权限，所以不构建、不运行依赖的任何代码：只提交 Cargo.lock 这一个文件。
  publish:
    needs: fix
    if: ${{ !cancelled() && needs.fix.result == 'success' && needs.fix.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: advisory-fix
          path: ${{ runner.temp }}/fix
      - name: Push branch and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/fix/Cargo.lock" Cargo.lock
          # 分支名取自锁文件内容：同样的修复每天重跑时不重复开分支。
          branch="advisory-fix/$(sha256sum Cargo.lock | cut -c1-12)"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            echo "$branch already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Cargo.lock
          git commit -m "Update dependencies with security advisories"
          git push origin "$branch"
          # GITHUB_TOKEN 的推送不触发 push 事件，CI 要手动触发。
          gh workflow run ci.yml --ref "$branch"
          # 仓库没有打开“允许 GitHub Actions 创建 PR”时分支仍然在，只给出提示。
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "Update dependencies with security advisories" \
            --body-file "$RUNNER_TEMP/fix/summary.md" \
            || echo "::warning::could not open a pull request; the fix is on branch $branch"
