name: Advisories

# 每天检查一次依赖的安全公告（RustSec 漏洞库）：新公告在下一次发布之前就会被发现，而不是发布之后。
# 失败时 GitHub 会通知仓库所有者；也可以在 Actions 页面手动运行（workflow_dispatch）。
on:
  schedule:
    - cron: "17 1 * * *" # 每天 01:17 UTC（台北时间 09:17）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
