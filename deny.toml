# cargo-deny 配置：供应链审查（漏洞公告、许可证、来源、重复依赖）。

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# 有新公告时 CI 失败，修复之后才能发布。唯一的例外在下面列出，并写明原因。
ignore = [
    # RUSTSEC-2026-0543：chrono 不再维护（信息类公告，不是漏洞）。chrono 只经 russh-sftp 进来（sftp 文件属性的时间戳），
    # russh-sftp 到 3.0.1 为止的所有版本都依赖它，没有可换的版本；本项目自己的代码不用 chrono。russh-sftp 换掉 chrono 后删除这一条。
    { id = "RUSTSEC-2026-0543", reason = "chrono only via russh-sftp (no chrono-free release); informational advisory" },
]

[licenses]
version = 2
# 本工作区的 crate 不发布（publish = false），不检查它们自己的许可证。
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 只允许这一个 git 来源：Cargo.toml 里临时固定的 russh 提交（rsa 0.10 的修复），russh 发版后删除。
allow-git = ["https://github.com/Eugeny/russh"]
