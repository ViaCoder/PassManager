# cargo-deny 配置：供应链审查（漏洞公告、许可证、来源、重复依赖）。

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin 计时侧信道只影响 RSA 私钥运算。PassManager 只在用户保存了 RSA 私钥的 SSH 条目上，
    # 对每次连接（且只连向条目绑定的主机）做一次签名；主机 RSA 公钥验证不受影响。
    # 为保留对 RSA 密钥的兼容性而接受该风险，文档建议使用 Ed25519 密钥。
    { id = "RUSTSEC-2023-0071", reason = "only RSA private-key ops; one signature per SSH connection to a bound host; ed25519 recommended" },
]

[licenses]
version = 2
# 本工作区的 crate 不发布（publish = false），不检查它们自己的许可证。
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
