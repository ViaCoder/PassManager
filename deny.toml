# cargo-deny 配置：供应链审查（漏洞公告、许可证、来源、重复依赖）。

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# 不忽略任何公告：有新公告时 CI 失败，修复之后才能发布。
ignore = []

[licenses]
version = 2
# 本工作区的 crate 不发布（publish = false），不检查它们自己的许可证。
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 只允许这一个 git 来源：Cargo.toml 里临时固定的 russh 提交（rsa 0.10 的修复），russh 发版后删除。
allow-git = ["https://github.com/Eugeny/russh"]
