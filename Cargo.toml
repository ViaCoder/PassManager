[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.11-rc.20"
edition = "2024"
rust-version = "1.89"
publish = false
license-file = "LICENSE"

[workspace.dependencies]
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
oqs = { version = "=0.11.0", default-features = false, features = ["std", "classic_mceliece"] }
oqs-sys = { version = "=0.11.0", default-features = false, features = ["classic_mceliece"] }
argon2 = { version = "=0.5.3", features = ["zeroize"] }
getrandom = "0.3"
zeroize = { version = "1", features = ["derive", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
hex = "0.4"
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# 临时：russh 0.65.1 把 rsa 钉在 0.10.0-rc.18，这个版本有 Marvin 计时侧信道（RUSTSEC-2023-0071），
# 修复只在 rsa 0.10.0 正式版里。上游的提交 c5443372（#821）改用了 rsa 0.10，但还没有发版。
# 这里固定到上游主分支的完整提交号（v0.65.1 之后只多了这一处依赖适配和 CI 配置），源码由 cargo vendor 收进 vendor/。
# russh 发布 0.65.2 或更新版本后删除这一段，并删掉 deny.toml 里对应的 allow-git。
[patch.crates-io]
russh = { git = "https://github.com/Eugeny/russh", rev = "b541663a88381aab9f6af1af7bbadb02e155058a" }
