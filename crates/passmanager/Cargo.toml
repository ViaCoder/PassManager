[package]
name = "passmanager"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true
description = "PassManager: a post-quantum password manager for AI agents"

[[bin]]
name = "PassManager"
path = "src/main.rs"

[dependencies]
pm-crypto = { path = "../pm-crypto" }
pm-vault = { path = "../pm-vault" }
pm-platform = { path = "../pm-platform" }
pm-proto = { path = "../pm-proto" }
pm-service = { path = "../pm-service" }
pm-tui = { path = "../pm-tui" }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
base64.workspace = true
hex.workspace = true
clap = { version = "4", features = ["derive"] }
rpassword = "7"
zxcvbn = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["user", "fs"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
russh = "0.64"
russh-sftp = "3"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rcgen = "0.14"
