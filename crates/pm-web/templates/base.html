<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% block title %}PassManager{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">PassManager</a>
  {% if csrf %}
  <nav>
    <a href="/">状态</a>
    <a href="/entries">条目</a>
    <a href="/tokens">Agent 令牌</a>
    <a href="/pins">主机指纹</a>
    <a href="/settings">设置</a>
    <a href="/security">安全状态</a>
    <form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">退出</button></form>
  </nav>
  {% endif %}
</header>
{% if conn %}
<div class="pq" title="TLS 1.3，混合后量子密钥交换">🔒 {{ conn.group }} + {{ conn.suite }}</div>
{% endif %}
<main>
{% if flash %}<p class="flash {{ flash_kind }}">{{ flash }}</p>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
