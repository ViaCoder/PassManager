[package]
name = "pm-web"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true
description = "PassManager web admin (server-rendered, no JavaScript)"

[dependencies]
pm-proto = { path = "../pm-proto" }
pm-net = { path = "../pm-net" }
pm-crypto = { path = "../pm-crypto" }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
hex.workspace = true
base64.workspace = true
axum = "0.8"
minijinja = { version = "3", features = ["serde", "urlencode"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
