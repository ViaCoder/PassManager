[package]
name = "pm-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
description = "PassManager web admin (server-rendered, no JavaScript)"

[dependencies]
pm-proto = { path = "../pm-proto" }
pm-net = { path = "../pm-net" }
pm-crypto = { path = "../pm-crypto" }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
hex.workspace = true
base64.workspace = true
# 两步验证"显示密钥"时把 otpauth 链接画成二维码（SVG，不带图片库）
qrcode = { version = "=0.14.1", default-features = false }
# multipart：两步验证的导入页上传二维码图片与 2FAS 备份文件
axum = { version = "0.8", features = ["multipart"] }
minijinja = { version = "3", features = ["serde", "urlencode"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "service"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }

[dev-dependencies]
# 测试里在进程内解码二维码、生成二维码图片
pm-otp = { path = "../pm-otp" }
png = "0.18"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
